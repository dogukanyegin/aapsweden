<!-- ESKİ KODU SİLİP BUNU YAPIŞTIRIN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jiljagziblneudrgybsd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_x_QULUCUF0-8PMq9GAkRBQ_4DVB0B07';
    
    // HATA BURADA DÜZELTİLDİ: Değişken adı 'supabaseClient' olarak değiştirildi.
    // Global 'supabase' objesini kullanarak yeni bir istemci oluşturuyoruz.
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elementleri
    const loginView = document.getElementById('login-view');
    const adminView = document.getElementById('admin-view');
    const loginForm = document.getElementById('login-form');
    const addEventForm = document.getElementById('add-event-form');
    const logoutButton = document.getElementById('logout-button');
    const eventsListContainer = document.getElementById('events-list-container');
    const errorMessage = document.getElementById('error-message');

    // --- OTURUM KONTROLÜ ---
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            loginView.style.display = 'none';
            adminView.style.display = 'block';
            fetchEvents();
        } else {
            loginView.style.display = 'block';
            adminView.style.display = 'none';
        }
    });

    // --- GİRİŞ İŞLEMİ ---
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            errorMessage.textContent = 'Giriş başarısız: ' + error.message;
        } else {
            errorMessage.textContent = '';
        }
    });

    // --- ÇIKIŞ İŞLEMİ ---
    logoutButton.addEventListener('click', () => {
        supabaseClient.auth.signOut();
    });

    // --- YENİ ETKİNLİK EKLEME (RLS ile GÜVENLİ) ---
    addEventForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const eventData = {
            post_name: document.getElementById('post_name').value,
            content: document.getElementById('content').value,
            date: document.getElementById('date').value,
            image_url: document.getElementById('image_url').value,
        };

        const { error } = await supabaseClient.from('aapsverige').insert(eventData);

        if (error) {
            alert('Hata: Etkinlik eklenemedi. (Yetkiniz olmayabilir): ' + error.message);
        } else {
            alert('Etkinlik başarıyla eklendi!');
            addEventForm.reset();
            fetchEvents(); // Listeyi yenile
        }
    });

    // --- MEVCUT ETKİNLİKLERİ GETİRME ---
    async function fetchEvents() {
        const { data, error } = await supabaseClient
            .from('aapsverige')
            .select('*')
            .order('date', { ascending: false });

        if (error) {
            eventsListContainer.innerHTML = '<p>Etkinlikler yüklenemedi.</p>';
            return;
        }

        eventsListContainer.innerHTML = ''; // Listeyi temizle
        data.forEach(event => {
            const item = document.createElement('div');
            item.className = 'event-list-item';
            item.innerHTML = `
                <p><strong>${event.post_name}</strong> (${new Date(event.date).toLocaleDateString()})</p>
                <button data-id="${event.id}">Sil</button>
            `;
            eventsListContainer.appendChild(item);
        });
    }

    // --- ETKİNLİK SİLME (RLS ile GÜVENLİ) ---
    eventsListContainer.addEventListener('click', async (e) => {
        if (e.target.tagName === 'BUTTON' && e.target.dataset.id) {
            const eventId = e.target.dataset.id;
            if (confirm('Bu etkinliği silmek istediğinizden emin misiniz?')) {
                
                const { error } = await supabaseClient.from('aapsverige').delete().match({ id: eventId });

                if (error) {
                    alert('Hata: Etkinlik silinemedi. (Yetkiniz olmayabilir): ' + error.message);
                } else {
                    alert('Etkinlik başarıyla silindi.');
                    fetchEvents(); // Listeyi yenile
                }
            }
        }
    });
</script>
